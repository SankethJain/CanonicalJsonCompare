# Builds ready-to-run programs for Windows, macOS and Linux and attaches them
# to a GitHub Release. Start it by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Needed only when Windows code signing is enabled (see "Sign" below).
  id-token: write

env:
  CARGO_TERM_COLOR: always
  BIN: mongo-compare

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "MONGO_COMPARE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      # Optional Windows code signing with Azure Artifact Signing (formerly
      # Trusted Signing). Signed programs are not blocked by Smart App Control
      # and SmartScreen stops warning once the certificate has a reputation.
      # Turned on by setting the repository variable WINDOWS_SIGNING=true;
      # see "Code signing" in the README for the one-time Azure setup.
      - name: Azure login (for signing)
        if: matrix.archive == 'zip' && vars.WINDOWS_SIGNING == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign
        if: matrix.archive == 'zip' && vars.WINDOWS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\${{ env.BIN }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Mongo Compare
          description-url: https://github.com/SankethJain/CanonicalJsonCompare
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "$env:BIN-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe" $name
          Copy-Item README.md $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="$BIN-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/$BIN" "$name/"
          cp README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.zip
            *.tar.gz
            *.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            scripts/install.sh
            scripts/install.ps1
          generate_release_notes: true
          body: |
            ## Install

            **Windows** - open PowerShell and paste (no admin rights needed):
            ```powershell
            irm https://github.com/SankethJain/CanonicalJsonCompare/releases/latest/download/install.ps1 | iex
            ```
            Downloading the `.zip` by hand instead? Right-click the zip > **Properties** > tick **Unblock** > **OK**
            *before* extracting it, otherwise Windows may block `mongo-compare.exe`.

            **macOS / Linux** - open Terminal and paste:
            ```sh
            curl -fsSL https://github.com/SankethJain/CanonicalJsonCompare/releases/latest/download/install.sh | sh
            ```
